<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Amoji — opening…</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #070a10;
        color: #f7f1e8;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <p>Opening Amoji…</p>
    <script>
      (function () {
        var search = location.search || "";
        var params = new URLSearchParams(search.replace(/^\?/, ""));
        if (params.get("kind") === "lite" || params.get("lite") === "1") {
          if (!params.get("role")) params.set("role", "secretary");
          params.delete("kind");
          params.delete("lite");
        }
        if (params.get("tab") === "today" && !params.get("role")) {
          params.set("role", "secretary");
        }
        if (params.get("autostart") !== "1" && params.get("pick") !== "0") {
          if (!params.get("pick")) params.set("pick", "1");
          if (!params.get("automic")) params.set("automic", "0");
        }

        function mintStamp() {
          return String(Date.now()) + String(Math.floor(Math.random() * 1000)).padStart(3, "0");
        }

        function goFresh(stamp, build) {
          if (build) params.set("build", build);
          params.set("_cb", stamp);
          var qs = params.toString();
          location.replace("/n/" + stamp + "/full" + (qs ? "?" + qs : ""));
        }

        fetch("/api/health", { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (health) {
            goFresh(mintStamp(), (health && health.build) || "");
          })
          .catch(function () {
            goFresh(mintStamp(), "");
          });
      })();
    </script>
  </body>
</html>
