<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Amoji — opening…</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #070a10;
        color: #f7f1e8;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <p>Opening Amoji…</p>
    <script>
      (function () {
        var search = location.search || "";
        var params = new URLSearchParams(search.replace(/^\?/, ""));
        if (params.get("kind") === "lite" || params.get("lite") === "1") {
          if (!params.get("role")) params.set("role", "secretary");
          params.delete("kind");
          params.delete("lite");
        }
        if (params.get("tab") === "today" && !params.get("role")) {
          params.set("role", "secretary");
        }
        if (params.get("autostart") !== "1" && params.get("pick") !== "0") {
          if (!params.get("pick")) params.set("pick", "1");
          if (!params.get("automic")) params.set("automic", "0");
        }
        var fallbackPath = "/companion-full";

        function go(path) {
          var qs = params.toString();
          location.replace(path + (qs ? "?" + qs : ""));
        }

        fetch("/api/health", { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (health) {
            var build = health && health.build;
            if (build) params.set("build", build);
            params.set("_cb", String(Date.now()));
            if (!build) {
              go(fallbackPath);
              return;
            }
            var pinnedPath = "/c/" + encodeURIComponent(build) + "/full";
            var qs = params.toString();
            var suffix = qs ? "?" + qs : "";
            return fetch(pinnedPath + suffix, { method: "HEAD", cache: "no-store" }).then(
              function (r) {
                go(r && r.ok ? pinnedPath : fallbackPath);
              },
            );
          })
          .catch(function () {
            go(fallbackPath);
          });
      })();
    </script>
  </body>
</html>
