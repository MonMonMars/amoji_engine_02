<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Amoji</title>
    <meta http-equiv="refresh" content="0;url=/companion?lang=yue" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #070a10;
        color: #f7f1e8;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #c8d0e0;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      a {
        display: block;
        padding: 0.85rem 1rem;
        border-radius: 999px;
        color: #061018;
        background: linear-gradient(135deg, #7fd4cf, #5bb8d6);
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary {
        color: #e8eeff;
        background: rgba(124, 156, 255, 0.22);
        border: 1px solid rgba(124, 156, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Amoji</h1>
      <p>粵語動漫同伴 · Cantonese anime companion</p>
      <div class="links">
        <a href="/app">📱 手機 App · Mobile (Pet & Chase)</a>
        <a class="secondary" href="/companion?lang=yue">開始傾計 · Lite chat</a>
        <a class="secondary" href="/companion-full?lang=yue">3D 同伴 · Full avatar</a>
        <a class="secondary" href="/voice-emotion-demo">Voice emotion demo (EN)</a>
        <a class="secondary" href="/companion-full?lang=en&pick=1&automic=0&voice=openai-coral">English companion · Coral voice</a>
      </div>
      <p><a href="/api/health" style="color:#7fd4cf;background:none;padding:0">Status check</a></p>
    </div>
    <script>
      if (!location.search) {
        setTimeout(function () {
          location.replace("/companion?lang=yue");
        }, 80);
      }
    </script>
  </body>
</html>
