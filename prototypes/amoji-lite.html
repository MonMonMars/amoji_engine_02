<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Amoji Secretary</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search || "");
        params.set("role", "secretary");
        params.set("pick", "1");
        params.set("automic", "0");
        location.replace("/play?" + params.toString());
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 1.5rem; text-align: center">
      Redirecting to unified 3D secretary…
      <a href="/play?role=secretary&pick=1&automic=0">Continue</a>
    </p>
  </body>
</html>
