<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />

      window.__amojiBuild = "2026-09-15-v76-character-model-fix";

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #070a10;
        color: #f7f1e8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .app {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 42rem;
        margin: 0 auto;
        padding: max(0.75rem, env(safe-area-inset-top)) 1rem
          calc(4.5rem + env(safe-area-inset-bottom));
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      h1 span {
        color: #7fd4cf;
      }
      h2 {
        margin: 0 0 0.35rem;
        font-size: 1.05rem;
        font-weight: 700;
      }
      .tag {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(247, 241, 232, 0.45);
        padding: 0.2rem 0.45rem;
        border: 1px solid rgba(247, 241, 232, 0.12);
        border-radius: 0.35rem;
      }
      .tag.cloud {
        text-transform: none;
        letter-spacing: 0;

      .status {

      }
      .panel {
        flex: 1;

        flex-direction: column;
        min-height: 0;
      }
      .panel.hidden {
        display: none !important;
      }
      .brief-card {
        padding: 1rem;
        border-radius: 1rem;
        background: linear-gradient(145deg, rgba(127, 212, 207, 0.12), rgba(91, 184, 214, 0.08));
        border: 1px solid rgba(127, 212, 207, 0.25);
        margin-bottom: 0.75rem;
      }
      .brief-card p {
        margin: 0.35rem 0 0;
        line-height: 1.45;
        font-size: 0.92rem;
      }
      .muted {
        color: rgba(247, 241, 232, 0.55);

      }
      .task-stack {

        gap: 0.45rem;
        margin-bottom: 0.75rem;
      }
      .task-row {

      .task-row-title {

      .task-row-due {

      }
      .messages {

      .bubble {

      .bubble.user {

        border: 1px solid rgba(127, 212, 207, 0.35);

      .bubble.bot {

      .task-card {

        border-radius: 0.65rem;

        border: 1px solid rgba(255, 100, 100, 0.45);

      }

      .composer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: flex-end;
        padding: 0.5rem;
        border-radius: 1.1rem;
        background: rgba(10, 14, 22, 0.9);
        border: 1px solid rgba(247, 241, 232, 0.14);
      }
      .composer textarea {
        flex: 1 1 100%;
        min-height: 2.6rem;
        max-height: 7rem;
        resize: none;
        border: none;
        background: transparent;
        color: #f7f1e8;
        font: inherit;
        font-size: 1rem;
        outline: none;
        padding: 0.35rem 0.25rem;
      }
      .row {
        display: flex;
        gap: 0.4rem;
        width: 100%;
        align-items: center;
      }
      button {
        border: none;
        cursor: pointer;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .btn {
        height: 2.5rem;
        min-width: 2.5rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        font-weight: 650;
        padding: 0 0.85rem;
        background: rgba(247, 241, 232, 0.08);
        color: #f7f1e8;
        border: 1px solid rgba(247, 241, 232, 0.14);
      }
      .btn.mini {
        height: 2rem;
        min-width: 0;
        font-size: 0.75rem;
        padding: 0 0.65rem;
        border-radius: 0.55rem;
      }
      .btn.primary,
      .btn.send {
        background: linear-gradient(135deg, #7fd4cf, #5bb8d6);

      }
      .btn.danger {
        background: rgba(255, 100, 100, 0.15);
        border-color: rgba(255, 120, 120, 0.35);
        color: #ffb4b4;
      }
      .btn.mic.active {

      .start-btn,

        font-weight: 650;
      }

      .btn-voice {

        font-weight: 600;
        padding: 0.28rem 0.5rem;
        border-radius: 0.45rem;
        background: rgba(247, 241, 232, 0.06);
        border: 1px solid rgba(247, 241, 232, 0.14);
        color: rgba(247, 241, 232, 0.72);
        text-decoration: none;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-3d {
        background: rgba(127, 212, 207, 0.14);
        border-color: rgba(127, 212, 207, 0.42);
        color: #9ee8e3;
      }
      .btn-voice {
        background: rgba(180, 140, 255, 0.12);
        border-color: rgba(180, 140, 255, 0.35);

      }
      .mode-row,
      .discover {

        gap: 0.35rem;

      }
      .mode-chip,
      .discover-chip {
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(247, 241, 232, 0.06);
        border: 1px solid rgba(247, 241, 232, 0.12);
        color: rgba(247, 241, 232, 0.8);
      }
      .mode-chip.active {
        background: rgba(127, 212, 207, 0.18);
        border-color: rgba(127, 212, 207, 0.45);

      }
      .discover-chip {
        background: rgba(124, 156, 255, 0.12);

      }
      .top3-card {
        padding: 0.85rem;
        border-radius: 0.9rem;
        background: rgba(124, 156, 255, 0.1);

      }
      .top3-card h2 {
        font-size: 0.88rem;

      }
      .top3-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;

      .top3-row:last-child {

      .top3-num {
        width: 1.35rem;

      }
      .filter-row {
        display: flex;

      }
      .filter-chip {

        background: rgba(247, 241, 232, 0.06);
        border: 1px solid rgba(247, 241, 232, 0.12);

        font-family: inherit;
      }
      .filter-chip.active {
        background: rgba(127, 212, 207, 0.16);
        border-color: rgba(127, 212, 207, 0.45);
        color: #b8f0ec;
      }
      .task-card,
      .draft-card,
      .memory-card {
        margin: 0.45rem 0;
        padding: 0.75rem;

        background: rgba(247, 241, 232, 0.06);
        border: 1px solid rgba(247, 241, 232, 0.14);
      }
      .draft-card pre,
      .draft-card .draft-body {
        margin: 0.45rem 0 0;
        padding: 0.65rem;
        border-radius: 0.55rem;
        background: rgba(10, 14, 22, 0.75);
        border: 1px solid rgba(247, 241, 232, 0.1);
        font-size: 0.84rem;
        line-height: 1.45;

      }
      .task-card-title,
      .draft-card-title,
      .memory-card-title {
        font-size: 0.86rem;
        font-weight: 650;
        margin-bottom: 0.35rem;
      }
      .task-card-actions,
      .draft-card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;

      .priority-btn {
        align-self: flex-start;

        border-radius: 999px;

        border: 1px solid rgba(124, 156, 255, 0.45);

      }
      .priority-btn.active {
        background: rgba(124, 156, 255, 0.42);
        border-color: rgba(180, 200, 255, 0.7);
        color: #fff;
      }
      .bubble.receipt {
        font-size: 0.82rem;

      .me-section {
        margin-bottom: 1rem;
      }
      .me-section label {

      }
      .me-section select {
        width: 100%;
        border-radius: 0.65rem;
        border: 1px solid rgba(247, 241, 232, 0.14);
        background: rgba(10, 14, 22, 0.85);
        color: #f7f1e8;
        padding: 0.55rem 0.7rem;
        font: inherit;
      }
      .memory-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.55rem 0.65rem;
        border-radius: 0.65rem;
        background: rgba(247, 241, 232, 0.05);
        border: 1px solid rgba(247, 241, 232, 0.1);
        margin-bottom: 0.35rem;
        font-size: 0.88rem;
      }
      .tabbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 42rem;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.25rem;
        padding: 0.45rem 0.75rem calc(0.55rem + env(safe-area-inset-bottom));
        background: rgba(7, 10, 16, 0.94);
        border-top: 1px solid rgba(247, 241, 232, 0.1);
        backdrop-filter: blur(12px);
      }
      .tabbar button {
        border-radius: 0.75rem;
        padding: 0.45rem 0.25rem;
        font-size: 0.72rem;
        font-weight: 650;
        color: rgba(247, 241, 232, 0.55);
        background: transparent;
      }
      .tabbar button.active {
        color: #9ee8e3;
        background: rgba(127, 212, 207, 0.12);
      }
      .companion-picker {
        position: fixed;
        inset: 0;
        z-index: 12000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .companion-picker[hidden] {
        display: none !important;
      }
      .companion-picker-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(4, 6, 12, 0.62);
        backdrop-filter: blur(6px);
      }
      .companion-picker-sheet {
        position: relative;

        border-radius: 1.35rem 1.35rem 0 0;
        background: linear-gradient(180deg, rgba(18, 22, 34, 0.98), rgba(10, 12, 20, 0.98));
        border: 1px solid rgba(247, 241, 232, 0.12);
        box-shadow: 0 -18px 48px rgba(0, 0, 0, 0.45);
        overflow: auto;
      }
      .companion-picker-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
      }
      .companion-picker-title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .companion-picker-sub {
        margin: 0.2rem 0 0;
        color: rgba(247, 241, 232, 0.55);
        font-size: 0.74rem;
        line-height: 1.4;
      }
      .companion-picker-close {
        border: 1px solid rgba(247, 241, 232, 0.14);
        background: rgba(255, 255, 255, 0.04);

        height: 2rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .companion-voice-list {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        max-height: min(52vh, 420px);
        overflow-y: auto;
        padding: 0.15rem 0 0.25rem;
      }
      .companion-voice-option {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15rem;
        width: 100%;
        padding: 0.7rem 0.85rem;
        border-radius: 0.85rem;
        border: 1px solid rgba(247, 241, 232, 0.12);
        background: rgba(247, 241, 232, 0.04);
        color: #f7f1e8;
        text-align: left;
        cursor: pointer;
        font-family: inherit;
      }
      .companion-voice-option.is-selected {
        border-color: rgba(127, 212, 207, 0.55);
        background: rgba(127, 212, 207, 0.12);
      }
      .companion-voice-option-name {
        font-size: 0.92rem;
        font-weight: 700;
      }
      .companion-voice-option-meta {
        font-size: 0.72rem;
        color: rgba(247, 241, 232, 0.55);

  <body>
    <div class="app" id="app">
      <header>
        <h1 id="app-title">Amoji <span>秘書</span></h1>
        <div class="header-actions">
          <a class="btn-3d" id="btn-3d" href="/companion-full">3D 同伴</a>
          <button type="button" class="btn-voice" id="btn-voice" title="Switch voice">女聲</button>
          <a class="btn-lang" id="btn-lang" href="?lang=en" title="Switch language">粵</a>
          <span class="tag" id="build-tag">secretary-v1</span>
          <span class="tag cloud hidden" id="cloud-tag">☁️ Cloud</span>
        </div>
      </header>

      <div class="status" id="status" aria-live="polite"></div>
      <div class="error-box" id="error-box" role="alert"></div>

      <section class="panel" id="panel-today">
        <div class="brief-card" id="brief-card"></div>
        <div class="top3-card hidden" id="top3-card">
          <h2 id="top3-title">今日 Top 3</h2>
          <div id="top3-list"></div>
        </div>
        <div class="task-stack" id="today-tasks"></div>
        <form class="inline-form" id="quick-task-form">
          <input id="quick-task-input" type="text" placeholder="想我跟進咩？" />
          <button type="submit" class="btn mini primary" id="quick-task-submit">加任務</button>
        </form>
        <button type="button" class="cta-btn" id="open-chat-btn">去傾計</button>
      </section>

      <section class="panel hidden" id="panel-chat">
        <div class="mode-row" id="mode-row"></div>
        <div class="discover" id="discover-chips"></div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <button type="button" class="start-btn" id="start-btn">開始傾計</button>
        <form class="composer hidden" id="composer" autocomplete="off">
          <textarea id="input" rows="1" placeholder="輸入訊息…" enterkeyhint="send"></textarea>
          <div class="row">
            <button type="button" class="btn speaker" id="speaker-btn" title="Speaker" aria-pressed="true">🔊</button>
            <button type="button" class="btn mic" id="mic-btn" title="Mic">🎤</button>
            <button type="submit" class="btn send" id="send-btn">Send</button>
          </div>
        </form>
      </section>

      <section class="panel hidden" id="panel-tasks">
        <h2>任務清單</h2>
        <div class="filter-row" id="task-filters"></div>
        <div class="task-stack" id="tasks-list"></div>
      </section>

      <section class="panel hidden" id="panel-me">
        <div class="me-section">
          <label><input type="checkbox" id="pref-morning-brief" checked /> 早晨簡報</label>
        </div>
        <div class="me-section">
          <label><input type="checkbox" id="pref-reminders" /> 到期任務提醒（瀏覽器通知）</label>
        </div>
        <div class="me-section">
          <label for="pref-help-with">幫手範圍</label>
          <select id="pref-help-with">
            <option value="work">工作</option>
            <option value="life">生活</option>
            <option value="both" selected>工作 + 生活</option>
            <option value="chat">主要傾計</option>
          </select>
        </div>
        <div class="me-section">
          <label for="pref-tone">語氣</label>
          <select id="pref-tone">
            <option value="professional">專業</option>
            <option value="friendly" selected>友善</option>
            <option value="playful">俏皮</option>
          </select>
        </div>
        <div class="me-section">
          <h2>記憶</h2>
          <div id="memory-list"></div>
          <form class="inline-form" id="memory-form">
            <input id="memory-input" type="text" placeholder="加一條我應該記住嘅資料…" />
            <button type="submit" class="btn mini primary" id="memory-save-btn">儲存</button>
          </form>
        </div>
      </section>

      <nav class="tabbar" aria-label="Main">
        <button type="button" data-tab="today" class="active">今日</button>
        <button type="button" data-tab="chat">傾計</button>
