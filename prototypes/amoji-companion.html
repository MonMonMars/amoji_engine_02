<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Amoji · Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f7f1e8;
        --muted: rgba(247, 241, 232, 0.62);
        --line: rgba(247, 241, 232, 0.14);
        --glass: rgba(12, 16, 24, 0.48);
        --glass-strong: rgba(10, 14, 22, 0.72);
        --accent: #7fd4cf;
        --accent-2: #ff9e7a;
        --user: rgba(127, 212, 207, 0.18);
        --bot: rgba(255, 255, 255, 0.08);
        --danger: #ff7a90;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        --font-display: "Syne", sans-serif;
        --font-body: "DM Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-body);
        color: var(--ink);
        background: #070a10;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      .atmosphere {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(7, 10, 16, 0.25) 0%, rgba(7, 10, 16, 0.55) 55%, rgba(5, 7, 12, 0.82) 100%),
          url("/prototypes/assets/companion-bg-anime.png") center / cover no-repeat;
        z-index: 0;
      }

      .atmosphere::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
        opacity: 0.28;
        pointer-events: none;
        mix-blend-mode: soft-light;
      }

      #avatar-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: block;
        cursor: grab;
        touch-action: none;
      }

      .orbit-hint {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translateX(-50%);
        z-index: 4;
        pointer-events: none;
        color: var(--muted);
        font-size: 0.78rem;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        opacity: 0.85;
        transition: opacity 0.6s ease;
      }

      .orbit-hint.hide {
        opacity: 0;
      }

      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: max(1rem, env(safe-area-inset-top)) 1.25rem 0.5rem;
        pointer-events: none;
      }

      .brand {
        pointer-events: auto;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(1.5rem, 4vw, 2rem);
        letter-spacing: -0.04em;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      }

      .brand span {
        color: var(--accent);
      }

      .meta {
        pointer-events: auto;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .pill {
        border: 1px solid var(--line);
        background: var(--glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: var(--muted);
        font-size: 0.75rem;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
      }

      .pill strong {
        color: var(--ink);
        font-weight: 600;
      }

      .chat-layer {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0;
        z-index: 6;
        width: min(560px, calc(100% - 1.25rem));
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        pointer-events: none;
      }

      .transcript {
        pointer-events: auto;
        max-height: min(38vh, 320px);
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        padding: 0.25rem 0.15rem;
        mask-image: linear-gradient(180deg, transparent, #000 18%);
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%);
        scrollbar-width: thin;
      }

      .bubble {
        max-width: 88%;
        padding: 0.75rem 0.95rem;
        border-radius: 1.15rem;
        line-height: 1.45;
        font-size: 0.95rem;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        animation: rise 0.35s ease-out both;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user);
        border-bottom-right-radius: 0.35rem;
      }

      .bubble.assistant {
        align-self: flex-start;
        background: var(--bot);
        border-bottom-left-radius: 0.35rem;
      }

      .bubble.system {
        align-self: center;
        background: transparent;
        border: none;
        box-shadow: none;
        color: var(--muted);
        font-size: 0.8rem;
        padding: 0.2rem;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .composer {
        pointer-events: auto;
        display: flex;
        gap: 0.45rem;
        align-items: flex-end;
        padding: 0.45rem;
        border-radius: 1.6rem;
        background: var(--glass-strong);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }

      .icon-btn {
        width: 2.75rem;
        height: 2.75rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        cursor: pointer;
        flex-shrink: 0;
        font-size: 1.05rem;
        line-height: 1;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }

      .icon-btn:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.1);
      }

      .icon-btn.on {
        background: rgba(127, 212, 207, 0.22);
        border-color: rgba(127, 212, 207, 0.55);
      }

      .icon-btn.mic-live {
        background: rgba(255, 122, 144, 0.28);
        border-color: rgba(255, 122, 144, 0.7);
        animation: pulseMic 1.1s ease-in-out infinite;
      }

      .icon-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      @keyframes pulseMic {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 122, 144, 0.35);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(255, 122, 144, 0);
        }
      }

      .composer textarea {
        flex: 1;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
        line-height: 1.4;
        min-height: 1.4em;
        max-height: 7.5rem;
        padding: 0.7rem 0.75rem;
      }

      .composer textarea::placeholder {
        color: var(--muted);
      }

      .send {
        width: 2.75rem;
        height: 2.75rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #5bb8d6);
        color: #061018;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .send:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      .send:disabled {
        opacity: 0.45;
        cursor: wait;
        transform: none;
      }

      .settings {
        position: absolute;
        top: 4.2rem;
        right: 1rem;
        z-index: 7;
        width: min(320px, calc(100% - 2rem));
        padding: 0.9rem;
        border-radius: 1rem;
        background: var(--glass-strong);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
        display: none;
        gap: 0.55rem;
        flex-direction: column;
        box-shadow: var(--shadow);
      }

      .settings.open {
        display: flex;
      }

      .settings label {
        font-size: 0.72rem;
        color: var(--muted);
        display: grid;
        gap: 0.3rem;
      }

      .settings input {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        border-radius: 0.65rem;
        padding: 0.55rem 0.65rem;
        font: inherit;
      }

      .settings button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.55rem 0.75rem;
        background: var(--accent);
        color: #061018;
        font-weight: 650;
        cursor: pointer;
      }

      .gear {
        pointer-events: auto;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--ink);
        border-radius: 999px;
        width: 2.1rem;
        height: 2.1rem;
        cursor: pointer;
      }

      .lab-link {
        pointer-events: auto;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.75rem;
        border: 1px solid var(--line);
        background: var(--glass);
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
      }

      @media (max-width: 640px) {
        .chat-layer {
          width: calc(100% - 0.75rem);
        }
        .transcript {
          max-height: 34vh;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/amoji-engine/vendor/three.module.js",
          "three/addons/": "/amoji-engine/vendor/three/addons/",
          "@pixiv/three-vrm": "/amoji-engine/vendor/three-vrm/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="stage">
      <div class="atmosphere" aria-hidden="true"></div>
      <canvas id="avatar-canvas" aria-label="Amoji companion — drag to orbit"></canvas>
      <div class="orbit-hint" id="orbit-hint">Drag to orbit · Scroll to zoom</div>

      <header class="topbar">
        <div class="brand">Amoji <span>Live</span></div>
        <div class="meta">
          <div class="pill" id="mode-pill">LLM · <strong>local</strong></div>
          <div class="pill" id="emotion-pill">feel · <strong>neutral</strong></div>
          <div class="pill" id="voice-pill">voice · <strong>…</strong></div>
          <a class="lab-link" href="/prototypes/realtime-voice-lab.html">Lab</a>
          <button type="button" class="gear" id="btn-settings" title="LLM settings">⚙</button>
        </div>
      </header>

      <div class="settings" id="settings">
        <label>
          Online API base (OpenAI-compatible)
          <input id="api-url" placeholder="https://api.openai.com/v1 or leave blank for local" />
        </label>
        <label>
          API key (stored only in this browser)
          <input id="api-key" type="password" placeholder="sk-… optional" autocomplete="off" />
        </label>
        <label>
          Model
          <input id="api-model" placeholder="gpt-4o-mini" />
        </label>
        <button type="button" id="btn-save-llm">Save LLM</button>
      </div>

      <div class="chat-layer">
        <div class="transcript" id="transcript" aria-live="polite"></div>
        <form class="composer" id="composer">
          <button
            type="button"
            class="icon-btn on"
            id="btn-speaker"
            title="Speaker on/off"
            aria-pressed="true"
          >
            🔊
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btn-mic"
            title="Mic on/off — continuous listen; replies when you pause"
            aria-pressed="false"
          >
            🎤
          </button>
          <textarea
            id="input"
            rows="1"
            placeholder="同 Amoji 傾偈… or tap 🎤 to speak"
            enterkeyhint="send"
          ></textarea>
          <button class="send" id="send" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { createCompanionAvatar } from "../amoji-engine/engine/companion/createAvatar.js";
      import { createCompanionChat } from "../amoji-engine/engine/companion/chatLlm.js";
      import { createCompanionVoice } from "../amoji-engine/engine/companion/companionVoice.js";

      const canvas = document.getElementById("avatar-canvas");
      const transcript = document.getElementById("transcript");
      const form = document.getElementById("composer");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const modePill = document.getElementById("mode-pill");
      const emotionPill = document.getElementById("emotion-pill");
      const voicePill = document.getElementById("voice-pill");
      const settings = document.getElementById("settings");
      const btnSettings = document.getElementById("btn-settings");
      const btnSpeaker = document.getElementById("btn-speaker");
      const btnMic = document.getElementById("btn-mic");

      const params = new URLSearchParams(location.search);
      const avatarModelUrl =
        params.get("vrm") ||
        params.get("model3d") ||
        localStorage.getItem("amoji.companion.vrmUrl") ||
        "";
      const avatarPrefer = params.get("avatar") === "gltf" ? "gltf" : "auto";
      const stored = {
        url: localStorage.getItem("amoji.companion.apiUrl") || params.get("llm") || "",
        key: localStorage.getItem("amoji.companion.apiKey") || "",
        model:
          localStorage.getItem("amoji.companion.model") ||
          params.get("model") ||
          "gpt-4o-mini",
      };

      document.getElementById("api-url").value = stored.url;
      document.getElementById("api-key").value = stored.key;
      document.getElementById("api-model").value = stored.model;

      const { avatar, kind: avatarKind } = await createCompanionAvatar({
        canvas,
        modelUrl: avatarModelUrl || undefined,
        prefer: avatarPrefer,
      });
      const chat = createCompanionChat({
        apiUrl: stored.url || null,
        apiKey: stored.key || null,
        model: stored.model,
      });

      const orbitHint = document.getElementById("orbit-hint");
      canvas.addEventListener(
        "pointerdown",
        () => orbitHint?.classList.add("hide"),
        { once: true },
      );

      const setModePill = (mode) => {
        modePill.innerHTML = `LLM · <strong>${mode}</strong>`;
      };
      const setEmotionPill = (emotion) => {
        emotionPill.innerHTML = `feel · <strong>${emotion}</strong>`;
      };
      const setVoicePill = (label) => {
        voicePill.innerHTML = `voice · <strong>${label}</strong>`;
      };
      setModePill(chat.mode);

      const addBubble = (role, text) => {
        const el = document.createElement("div");
        el.className = `bubble ${role}`;
        el.textContent = text;
        transcript.appendChild(el);
        transcript.scrollTop = transcript.scrollHeight;
        return el;
      };

      let busy = false;

      const autosize = () => {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 120)}px`;
      };
      input.addEventListener("input", autosize);

      const syncMicBtn = () => {
        btnMic.classList.toggle("mic-live", voice.micOn);
        btnMic.classList.toggle("on", voice.micOn);
        btnMic.setAttribute("aria-pressed", voice.micOn ? "true" : "false");
        btnMic.textContent = voice.micOn ? "⏺" : "🎤";
      };

      const syncSpeakerBtn = () => {
        btnSpeaker.classList.toggle("on", voice.speakerOn);
        btnSpeaker.setAttribute("aria-pressed", voice.speakerOn ? "true" : "false");
        btnSpeaker.textContent = voice.speakerOn ? "🔊" : "🔇";
      };

      const voice = createCompanionVoice({
        lang: "zh-HK",
        onMouth: (open) => avatar.setMouthOpen(open),
        onTalking: (on) => avatar.setTalking(on),
        onMicText: (text, isFinal) => {
          input.value = text;
          autosize();
          if (isFinal) {
            input.value = "";
            autosize();
            void runTurn(text, { fromMic: true });
          }
        },
        onMicState: () => {
          syncMicBtn();
          if (voice.micOn) {
            input.placeholder = "Listening… speak, pause → she replies, then listens again";
          } else if (!busy) {
            input.placeholder = "同 Amoji 傾偈… or tap 🎤 for continuous talk";
          }
        },
        onError: (msg) => {
          if (msg && msg !== "aborted" && msg !== "no-speech" && msg !== "network") {
            addBubble("system", `Mic/TTS: ${msg}`);
          }
          syncMicBtn();
        },
      });

      /** @type {string[]} */
      const micQueue = [];

      const runTurn = async (text, { fromMic = false } = {}) => {
        const cleaned = String(text || "").trim();
        if (!cleaned) return;
        if (busy) {
          // Hold the next uttered line until the current reply finishes
          if (fromMic) micQueue.push(cleaned);
          return;
        }
        busy = true;
        sendBtn.disabled = true;
        // Keep mic button enabled so the user can end continuous listen
        voice.pauseCapture();
        addBubble("user", cleaned);
        avatar.setEmotion("thinking");
        setEmotionPill("thinking");
        avatar.setTalking(false);
        avatar.setMouthOpen(0);

        try {
          const result = await chat.reply(cleaned);
          setModePill(result.mode || chat.mode);
          const reply = result.reply || "……";
          const emotion = result.emotion || "happy";
          addBubble("assistant", reply);
          avatar.setEmotion(emotion);
          setEmotionPill(emotion);
          await voice.speak(reply, emotion);
        } catch (err) {
          addBubble("system", `Chat failed: ${err?.message || err}`);
          avatar.setEmotion("sad");
          setEmotionPill("sad");
        } finally {
          busy = false;
          sendBtn.disabled = false;
          voice.resumeCapture();
          syncMicBtn();
          if (voice.micOn) {
            input.placeholder = "Listening… speak, pause → she replies, then listens again";
            avatar.setEmotion("thinking");
            setEmotionPill("thinking");
          } else {
            input.focus();
          }
          // Drain one queued utterance from continuous mic (if any)
          if (micQueue.length && voice.micOn) {
            const next = micQueue.shift();
            void runTurn(next, { fromMic: true });
          } else {
            micQueue.length = 0;
          }
        }
      };

      void voice.ensureVoices().then((v) => {
        setVoicePill(v?.name?.split(" ")[0] || (voice.supportsSpeak ? "female" : "off"));
      });

      btnMic.disabled = !voice.supportsMic;
      syncSpeakerBtn();
      syncMicBtn();

      const avatarLabel =
        avatarKind === "vrm3d"
          ? "VRM anime girl"
          : avatarKind === "gltf3d"
            ? "HD female 3D"
            : avatarKind === "webgl3d"
              ? "3D female"
              : "2D female";
      addBubble(
        "system",
        `Grok-style companion · ${avatarLabel} · drag to orbit · 🎤 continuous talk (reply on each pause) · 🔊 speaker · real LLM via ⚙ or /api/chat`,
      );
      addBubble(
        "assistant",
        "嗨～我係 Amoji。撳麥克風保持開啟，你講完停低就會答你，再繼續聽。",
      );
      avatar.setEmotion("happy");
      setEmotionPill("happy");
      // Speak only after a user gesture (browser autoplay policy)
      const greetOnce = () => {
        void voice.speak(
          "嗨～我係 Amoji。撳麥克風保持開啟，你講完停低就會答你，再繼續聽。",
          "happy",
        );
        form.removeEventListener("pointerdown", greetOnce);
        input.removeEventListener("focus", greetOnce);
      };
      form.addEventListener("pointerdown", greetOnce, { once: true });
      input.addEventListener("focus", greetOnce, { once: true });

      btnSettings.addEventListener("click", () => {
        settings.classList.toggle("open");
      });

      document.getElementById("btn-save-llm").addEventListener("click", () => {
        const url = document.getElementById("api-url").value.trim();
        const key = document.getElementById("api-key").value.trim();
        const model = document.getElementById("api-model").value.trim() || "gpt-4o-mini";
        localStorage.setItem("amoji.companion.apiUrl", url);
        localStorage.setItem("amoji.companion.apiKey", key);
        localStorage.setItem("amoji.companion.model", model);
        const info = chat.setApi({ url, key, model });
        setModePill(info.mode);
        settings.classList.remove("open");
        addBubble(
          "system",
          info.mode === "online"
            ? `Online LLM ready · ${model}`
            : "Using local / proxy companion brain",
        );
      });

      btnSpeaker.addEventListener("click", () => {
        voice.setSpeakerOn(!voice.speakerOn);
        syncSpeakerBtn();
        addBubble("system", voice.speakerOn ? "Speaker on" : "Speaker muted");
      });

      btnMic.addEventListener("click", () => {
        if (!voice.supportsMic) {
          addBubble("system", "This browser has no speech recognition — type instead.");
          return;
        }
        const turningOn = !voice.micOn;
        if (turningOn) {
          micQueue.length = 0;
          voice.startMic();
          addBubble("system", "Mic on · continuous — speak, pause, she replies, listens again. Tap 🎤 to stop.");
          input.placeholder = "Listening… speak, pause → she replies, then listens again";
          if (!busy) {
            avatar.setEmotion("thinking");
            setEmotionPill("thinking");
          }
        } else {
          micQueue.length = 0;
          voice.stopMic();
          addBubble("system", "Mic off");
          input.placeholder = "同 Amoji 傾偈… or tap 🎤 for continuous talk";
        }
        syncMicBtn();
      });

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const text = input.value.trim();
        input.value = "";
        autosize();
        await runTurn(text);
      });

      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          form.requestSubmit();
        }
      });

      input.focus();
    </script>
  </body>
</html>
