<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRM motion transition test</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/amoji-engine/vendor/three.module.js",
          "three/addons/": "/amoji-engine/vendor/three/addons/",
          "@pixiv/three-vrm": "/amoji-engine/vendor/three-vrm/three-vrm.module.min.js",
          "@pixiv/three-vrm-animation": "/amoji-engine/vendor/three-vrm-animation/three-vrm-animation.module.min.js"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
      #avatar-canvas { width: 100%; height: 78vh; display: block; }
      #hud { padding: 0.75rem 1rem; }
    </style>
  </head>
  <body>
    <canvas id="avatar-canvas"></canvas>
    <div id="hud">Loading…</div>
    <script type="module">
      import { createVrmAvatar } from "/amoji-engine/engine/companion/vrmAvatar.js";
      import { DEFAULT_MOTION_CROSSFADE_SEC } from "/amoji-engine/engine/companion/vrmMotionTransition.js";

      window.__motionTransitionTest = { ready: false };

      const modelUrl = "/prototypes/assets/kizuna-kamatte.vrm";
      const hud = document.getElementById("hud");

      try {
        const head = await fetch(modelUrl, { method: "HEAD" });
        if (!head.ok) {
          window.__motionTransitionTest = { skipped: true, reason: "model-missing" };
          hud.textContent = "Skipped — model missing";
          throw new Error("skip");
        }

        const canvas = document.getElementById("avatar-canvas");
        const avatar = await createVrmAvatar({ canvas, modelUrl });

        for (let i = 0; i < 90; i += 1) avatar.update?.(1 / 60);

        avatar.playAction?.("wave", { emotion: "happy", single: true });
        for (let i = 0; i < 90; i += 1) avatar.update?.(1 / 60);

        avatar.playAction?.("thinking", { loop: true });
        for (let i = 0; i < 60; i += 1) avatar.update?.(1 / 60);

        await avatar.playCalmIdle?.();
        for (let i = 0; i < Math.ceil(DEFAULT_MOTION_CROSSFADE_SEC * 60) + 90; i += 1) {
          avatar.update?.(1 / 60);
        }

        const status = avatar.getMotionPlayerStatus?.() || {};
        window.__motionTransitionTest = {
          ready: true,
          crossfadeSec: DEFAULT_MOTION_CROSSFADE_SEC,
          currentAction: avatar.currentAction,
          transitionProgress: avatar.getMotionTransitionProgress?.(),
          playerStatus: status,
          libraryOk:
            status.libraryOwnsBody === true &&
            (status.activeActionId === "thinking" ||
              avatar.currentAction === "thinking"),
        };
        hud.textContent = JSON.stringify(window.__motionTransitionTest, null, 2);
      } catch (err) {
        if (err?.message !== "skip") {
          window.__motionTransitionTest = { ready: false, error: err?.message || String(err) };
          hud.textContent = window.__motionTransitionTest.error;
        }
      }
    </script>
  </body>
</html>
