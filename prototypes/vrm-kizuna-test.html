<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kizuna official VRM load test</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/amoji-engine/vendor/three.module.js",
          "three/addons/": "/amoji-engine/vendor/three/addons/",
          "@pixiv/three-vrm": "/amoji-engine/vendor/three-vrm/three-vrm.module.min.js",
          "@pixiv/three-vrm-animation": "/amoji-engine/vendor/three-vrm-animation/three-vrm-animation.module.min.js"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #avatar-canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="avatar-canvas"></canvas>
    <script type="module">
      import { createVrmAvatar } from "/amoji-engine/engine/companion/vrmAvatar.js";

      window.__kizunaVrmTest = { ready: false };

      try {
        const canvas = document.getElementById("avatar-canvas");
        const avatar = await createVrmAvatar({
          canvas,
          modelUrl: "/prototypes/assets/kizuna-kamatte.vrm",
        });

        const humanoid = avatar.vrm?.humanoid;
        const head = humanoid?.getNormalizedBoneNode?.("head");
        const leftArm = humanoid?.getNormalizedBoneNode?.("leftUpperArm");
        const expressionNames = avatar.vrm?.expressionManager?.expressionMap
          ? Object.keys(avatar.vrm.expressionManager.expressionMap)
          : [];

        avatar.setEmotion("happy");
        avatar.playAction?.("wave", { emotion: "happy" });
        avatar.setTalking(true);

        for (let i = 0; i < 30; i += 1) {
          avatar.update?.(1 / 30);
        }

        window.__kizunaVrmTest = {
          ready: true,
          hasHumanoid: Boolean(humanoid),
          hasHeadBone: Boolean(head),
          hasLeftArm: Boolean(leftArm),
          expressionCount: expressionNames.length,
          currentAction: avatar.currentAction || null,
          emotion: avatar.emotion || null,
        };
      } catch (err) {
        window.__kizunaVrmTest = {
          ready: false,
          error: err?.message || String(err),
        };
      }
    </script>
  </body>
</html>
