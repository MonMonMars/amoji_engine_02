<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amoji — one-time setup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a12;
      color: #e8e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      max-width: 420px;
      width: 100%;
      padding: 1.25rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    p { color: #9aa0b4; font-size: 0.9rem; line-height: 1.5; }
    input {
      width: 100%;
      box-sizing: border-box;
      margin: 0.75rem 0;
      padding: 0.65rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: inherit;
      font: inherit;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      border: 0;
      border-radius: 0.65rem;
      background: #7c9cff;
      color: #061018;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    a { color: #7c9cff; }
    .ok { color: #6ee7a8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Amoji smart brain setup</h1>
    <p>
      Paste your <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a>
      key (<code>sk-or-…</code>). Saved in this browser only — then opens Amoji.
    </p>
    <input id="key" type="password" placeholder="sk-or-v1-…" autocomplete="off" />
    <button type="button" id="save">Save &amp; open Amoji</button>
    <p id="msg" class="ok" hidden></p>
  </div>
  <script type="module">
    import { inferKeyProvider } from "../amoji-engine/engine/companion/companionClientKeys.js";
    import { saveProviderApiKey } from "../amoji-engine/engine/companion/companionLlmProviders.js";

    const input = document.getElementById("key");
    const msg = document.getElementById("msg");

    document.getElementById("save").addEventListener("click", () => {
      const key = input.value.trim();
      const provider = inferKeyProvider(key);
      if (!provider) {
        msg.hidden = false;
        msg.style.color = "#ff8a8a";
        msg.textContent = "Key must start with sk-or- (OpenRouter)";
        return;
      }
      saveProviderApiKey(provider, key);
      localStorage.setItem("amoji.companion.llmProvider", provider);
      msg.hidden = false;
      msg.style.color = "#6ee7a8";
      msg.textContent = "Saved! Opening Amoji…";
      setTimeout(() => {
        location.href = "/prototypes/amoji-companion.html";
      }, 600);
    });
  </script>
</body>
</html>
