<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRM arm rest test</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/amoji-engine/vendor/three.module.js",
          "three/addons/": "/amoji-engine/vendor/three/addons/",
          "@pixiv/three-vrm": "/amoji-engine/vendor/three-vrm/three-vrm.module.min.js"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #avatar-canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="avatar-canvas"></canvas>
    <script type="module">
      import { createVrmAvatar } from "/amoji-engine/engine/companion/vrmAvatar.js";
      const canvas = document.getElementById("avatar-canvas");
      const avatar = await createVrmAvatar({
        canvas,
        modelUrl: "/prototypes/assets/companion-girl.vrm",
      });
      avatar.setEmotion("happy");
      avatar.setTalking(true);
      window.__armTest = {
        ready: true,
        readArmZ() {
          const lua = avatar.vrm.humanoid.getNormalizedBoneNode("leftUpperArm");
          return lua?.rotation?.z ?? null;
        },
      };
    </script>
  </body>
</html>
