name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - cursor/companion-improvements-6647
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install amoji-engine deps
        run: cd amoji-engine && npm ci

      - name: Test
        run: cd amoji-engine && npm test

      - name: Deploy to Vercel
        id: vercel_deploy
        continue-on-error: true
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          vercel-args: "--prod"

      - name: Deploy note (when GitHub secrets missing)
        if: steps.vercel_deploy.outcome == 'failure'
        run: |
          echo "GitHub Vercel deploy skipped or failed (VERCEL_TOKEN may be unset)."
          echo "Production may still update via Vercel Git integration on push to main."
