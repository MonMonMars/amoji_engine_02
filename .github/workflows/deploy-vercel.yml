name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - cursor/companion-improvements-6647
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install amoji-engine deps
        run: cd amoji-engine && npm ci

      - name: Sync HTML build version
        run: node scripts/sync-build-version.mjs

      - name: Download legal VRM assets
        run: node amoji-engine/scripts/download-legal-vrm.mjs

      - name: Test
        run: cd amoji-engine && npm test

      - name: Deploy to Vercel
        id: vercel_deploy
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          vercel-args: "--prod"

      - name: Deploy note (when GitHub secrets missing)
        if: steps.vercel_deploy.outcome == 'failure'
        run: |
          echo "::warning::GitHub Vercel deploy skipped or failed (VERCEL_TOKEN may be unset)."
          echo "Production may still update via Vercel Git integration on push to main."

      - name: Production build status
        if: always()
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          DEPLOY_OUTCOME: ${{ steps.vercel_deploy.outcome }}
        run: |
          if [ "$HAS_VERCEL_TOKEN" != "true" ]; then
            echo "::warning::VERCEL_TOKEN is not set — GitHub Actions cannot deploy to Vercel."
            echo "Add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (Vercel → Project → Settings)."
            echo "Until then, rely on Vercel Git integration or run: npm run verify:production-build"
            node scripts/check-production-build.mjs --warn-only || true
            exit 0
          fi
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "Vercel deploy step succeeded (health may lag ~1 min)."
            sleep 25
            node scripts/check-production-build.mjs --warn-only || true
            exit 0
          fi
          sleep 20
          node scripts/check-production-build.mjs
